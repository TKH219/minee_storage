name: mine_storage
description: "Mine Storage mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  #
  # Riverpod stays on 2.x: BaseStateNotifier extends AutoDisposeNotifier, which
  # is a v2 API. Providers are declared by hand (see providers.dart), so
  # riverpod_generator is intentionally absent — it pins build/source_gen 2 and
  # would hold back every other generator in this project.
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^17.5.0

  # Network
  dio: ^5.8.0+1
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0
  supabase_flutter: ^2.14.2

  # Serialization
  json_annotation: ^4.12.0

  # Storage
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.5

  # Config
  envied: ^1.3.8

  # UI
  flutter_svg: ^2.1.0
  lottie: ^3.1.3

  # Localization
  easy_localization: ^3.0.8

  # Utils
  equatable: ^2.0.7
  intl: ^0.20.2
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.9.0
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.8
  envied_generator: ^1.3.8
  flutter_gen_runner: ^5.15.0

  # riverpod_lint/custom_lint are deliberately absent: riverpod_lint 2.x (the
  # only line compatible with riverpod 2) pins analyzer 7, while the code
  # generators above require analyzer 8+. Re-add both if this project ever
  # migrates to riverpod 3.
  flutter_lints: ^5.0.0

  # Launcher icons are generated, not hand-cut. Regenerate with:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# Source art lives in assets/launcher_icon/ and is deliberately outside the
# bundled asset folders — these PNGs are build-time input for the launcher
# icons, not something the app ever loads at runtime.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true

  # Legacy Android launchers (API 24-25) get the rounded plate baked in, since
  # they apply no mask of their own. iOS ships full-bleed and lets the system
  # squircle do the rounding.
  image_path_android: "assets/launcher_icon/app_icon_rounded.png"
  image_path_ios: "assets/launcher_icon/app_icon.png"
  remove_alpha_ios: true

  # API 26+ composites these two layers itself. The foreground art is re-centred
  # and pre-scaled so that after the generator's own 16% inset the carton lands
  # inside the 66dp safe circle every launcher mask honours.
  min_sdk_android: 24
  adaptive_icon_background: "#D4F5FC"
  adaptive_icon_foreground: "assets/launcher_icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/translations/

  # Weights are declared explicitly so a TextStyle asking for w500/w600/w700
  # gets the real cut instead of a synthetically emboldened regular.
  fonts:
    - family: DMMono
      fonts:
        - asset: fonts/DM_Mono/DMMono-Light.ttf
          weight: 300
        - asset: fonts/DM_Mono/DMMono-LightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/DM_Mono/DMMono-Regular.ttf
          weight: 400
        - asset: fonts/DM_Mono/DMMono-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/DM_Mono/DMMono-Medium.ttf
          weight: 500
        - asset: fonts/DM_Mono/DMMono-MediumItalic.ttf
          weight: 500
          style: italic
    - family: DMSans
      fonts:
        - asset: fonts/DM_Sans/static/DMSans-Light.ttf
          weight: 300
        - asset: fonts/DM_Sans/static/DMSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/DM_Sans/static/DMSans-Regular.ttf
          weight: 400
        - asset: fonts/DM_Sans/static/DMSans-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/DM_Sans/static/DMSans-Medium.ttf
          weight: 500
        - asset: fonts/DM_Sans/static/DMSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: fonts/DM_Sans/static/DMSans-SemiBold.ttf
          weight: 600
        - asset: fonts/DM_Sans/static/DMSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/DM_Sans/static/DMSans-Bold.ttf
          weight: 700
        - asset: fonts/DM_Sans/static/DMSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: pinyinok
      fonts:
        - asset: fonts/pinyinok/pinyinok.ttf

flutter_gen:
  integrations:
    flutter_svg: true
